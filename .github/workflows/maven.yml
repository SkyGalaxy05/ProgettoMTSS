name: CI Pipeline

on:
  push:
    branches: ["master", "develop"]
  pull_request:
    branches: ["master", "develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codice sorgente
        uses: actions/checkout@v3

      - name: Configurazione ambiente Java (JDK 11)
        uses: actions/setup-java@v3
        with:
          java-version: "11"
          distribution: "temurin"
          cache: maven

      # Step 1: Compilazione del progetto
      - name: Compilazione (Fase di compile)
        run: mvn compile

      # Step 2: Esecuzione dei test di unità
      - name: Test (Fase di test)
        run: mvn test

      # Step 3: Generazione report di code coverage e invio a Coveralls
      - name: Coveralls (Code Coverage)
        run: mvn jacoco:report coveralls:report -DrepoToken=${{ secrets.COVERALLS_TOKEN }}
        env:
          COVERALLS_TOKEN: ${{ secrets.COVERALLS_TOKEN }}

      # Step 4: Analisi Statica del codice con Checkstyle
      # Usiamo skipTests per non rieseguire i test già passati nello step precedente
      - name: Analisi Statica (Fase di package)
        run: mvn package -DskipTests
